<html>
<head>

    </title>
    <style>
        body{
            background-color: #111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        h1{
            margin-bottom: 30px;
        }
        button{
            background-color: #0077ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0,3s;
        }
        button:hover{
            background-color: #0055cc;
            transform: scale(1.05);
        }
        #projet{
            display: none;
            margin-top: 30px;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        a{
            color: #00aaff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Mon Portfolio</h1>
    <button onclick="afficherProjet()">Voir le projet</button>
    <div id="projet">
        <h2>Projet web</h2>
        <p>
            Site créé avec HTML, CSS et JavaScript.
        </p>
        <a href="https://github.com/TiavinaMiandravola04">
   Voir plus
</a>
    </div>
    <script>
        function afficherProjet(){document.getElementById("projet").style.display="block";}
    </script>
    <a href="index.html" class="retour">RETOUR</a>
</body>
</html>
